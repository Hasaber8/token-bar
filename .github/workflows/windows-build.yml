name: Windows build

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
      publish-release:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or release tag to build
        type: string
        required: true
      publish-release:
        description: Attach ZIPs to an existing release at this tag
        type: boolean
        default: false

jobs:
  build:
    permissions:
      contents: read
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runtime: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Scanner regression tests
        if: matrix.runtime == 'win-x64'
        run: dotnet run --project Windows/TokenBar.Tests -c Release
      - name: Build portable app and CLI
        shell: pwsh
        run: ./build.ps1 -Runtime ${{ matrix.runtime }}
      - name: Smoke check dashboard and CLI
        if: matrix.runtime == 'win-x64'
        shell: pwsh
        run: |
          $app = Start-Process -FilePath ./dist/TokenBar-win-x64/TokenBar.exe -ArgumentList @('--smoke-test', '.build/dashboard.png') -WindowStyle Hidden -PassThru
          if (!$app.WaitForExit(30000)) { $app.Kill(); throw 'Dashboard smoke check timed out' }
          if ($app.ExitCode -ne 0) { throw 'Dashboard smoke check failed' }
          ./dist/TokenBar-win-x64/token-bar-cli.exe --home "$env:RUNNER_TEMP/empty-profile" --json
          if ($LASTEXITCODE -ne 0) { throw 'CLI smoke check failed' }
      - name: Save dashboard previews
        if: always() && matrix.runtime == 'win-x64'
        uses: actions/upload-artifact@v7
        with:
          name: Windows-dashboard-previews
          path: .build/dashboard*.png
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        with:
          name: TokenBar-${{ matrix.runtime }}
          path: dist/TokenBar-*-${{ matrix.runtime }}.zip
          if-no-files-found: error

  upload-release:
    if: inputs.publish-release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Inherit the caller's permissions: release callers grant contents: write,
    # while CI grants contents: read and skips this job.
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: TokenBar-win-*
          path: dist
          merge-multiple: true
      - name: Attach portable Windows builds
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.ref }}
        run: gh release upload "$TAG" dist/*.zip --repo "$GITHUB_REPOSITORY" --clobber
